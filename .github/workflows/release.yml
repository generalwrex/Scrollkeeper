# Packages the addon and uploads it to CurseForge (and GitHub Releases)
# whenever a version tag is pushed, e.g.  git tag v0.5.0 ; git push --tags
#
# Tags containing "alpha" or "beta" upload as Alpha / Beta files.
# Needs a repository secret CF_API_KEY (CurseForge > Account > API tokens)
# and the CurseForge project ID in Scrollkeeper.toc (## X-Curse-Project-ID).

name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
