# Packages the addon and uploads it to CurseForge, Wago (and GitHub Releases)
# whenever a version tag is pushed, e.g.  git tag v0.5.0 ; git push --tags
#
# Tags containing "alpha" or "beta" upload as Alpha / Beta files.
# Needs a repository secret CF_API_KEY (CurseForge > Account > API tokens)
# and the CurseForge project ID in Scrollkeeper.toc (## X-Curse-Project-ID).
# Wago: repository secret WAGO_API_TOKEN (addons.wago.io > Account > API keys)
# and ## X-Wago-ID in the TOC. Without both, the Wago upload is skipped.

name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make the in-game news from the changelog
        run: python3 tools/make-news.py "${GITHUB_REF_NAME}"
      - uses: BigWigsMods/packager@v2
