name: Share your scroll data
description: Send your /sk export so everyone gets better odds, skill-up rates and drop spots.
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Every export makes Scrollkeeper smarter for everyone: real odds for each scroll tier,
        skill-up rates by color, where scrolls and books drop, and which books the librarians take.
        Combined data ships in future releases, so new players see it from day one.

        In game, type **`/sk export`**, press **Ctrl+C**, and paste it below.
        It contains scroll data only: no character or account names.
        Sending again later is fine: your newest export replaces your older one.
  - type: textarea
    id: export
    attributes:
      label: Export from /sk export
      render: text
      placeholder: |
        Scrollkeeper export 1
        meta|0.5.1|...
        T|1|...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Interesting finds, rare results, a new library or book spot...
